  <text x="24" y="66" xml:space="preserve"><tspan class="warn">Sample data (synthetic fixtures) — real tool output, nothing hand-written</tspan></text>
  
  <text x="24" y="106" xml:space="preserve"><tspan class="prompt">$ </tspan><tspan class="cmd">import_listing_html</tspan></text>
